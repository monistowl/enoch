[package]
name = "enoch"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ronaldsuwandi/enoch"
readme = "README.md"
license = "MIT"
rust-version = "1.80.0"
description = "Enochian Chess engine with WASM support"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true

[features]
default = ["tui"]
tui = ["crossterm", "ratatui"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook"]

[dependencies]
# TUI dependencies (optional for WASM builds)
crossterm = { version = "0.28.1", optional = true }
ratatui = { version = "0.29.0", optional = true }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
rand = "0.8"

# WASM dependencies
wasm-bindgen = { version = "=0.2.92", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints.rust]
unused_imports = "allow"
