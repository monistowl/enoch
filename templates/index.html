{% set home = get_page(path="pages/home.md") %}
<html>
  <head>
    <meta charset='utf-8'>
    <title>{{ home.title }}</title>
    <meta name="description" content="{{ config.description }}">
    <meta name="author" content="{{ config.author }}">
    {% if config.extra.favicon %}
      <link rel="icon" href="/{{ config.extra.favicon }}">
    {% endif %}
    {% if config.extra.twitter %}
      <meta name="twitter:site" content="@{{ config.extra.twitter }}">
    {% endif %}
    {% if config.extra.github %}
      <meta name="github" content="https://github.com/{{ config.extra.github }}">
    {% endif %}
  </head>
  <body>
    <nav>
      <a href="/enoch/">Home</a>
      <!-- Add more links here as you add pages -->
    </nav>
    <main>
      <h1>{{ home.title }}</h1>
      {{ home.content | safe }}
    </main>
  </body>
</html>
